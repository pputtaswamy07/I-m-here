name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Client unit tests (Vitest, 80% coverage threshold) ──
  client-unit-tests:
    name: Client — Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Run tests with coverage (fails if < 80%)
        run: npm run test:coverage
        working-directory: ./client

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/

  # ── 2. Server unit tests (Jest, 80% coverage threshold) ────
  server-unit-tests:
    name: Server — Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Run tests with coverage (fails if < 80%)
        run: npm run test:coverage
        working-directory: ./server
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/

  # ── 3. Build the client ─────────────────────────────────────
  build:
    name: Client — Production Build
    runs-on: ubuntu-latest
    needs: [client-unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Build
        run: npm run build
        working-directory: ./client

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  # ── 4. Cypress E2E tests (runs against the preview build) ───
  cypress-e2e:
    name: Cypress — E2E Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/

      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Run Cypress against preview server
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./client
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 30
          install: false

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots/
